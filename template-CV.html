<!doctype html>
<!-- Generated by build.py from config.json. Edit this file for CV layout and print styles. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>%%CV_PAGE_TITLE%%</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f8fafc; --elem: #eef2f6;
    --hair: #d7dee7; --hair2: #c5d0dc;
    --ink: #17212b; --muted: #526272; --soft: #314252;
    --accent: #a84b16; --cyan: #086b7a; --link: #075f87;
    --contact-note-base: %%CV_CONTACT_NOTE_COLOR%%;
    --contact-note-color: color-mix(in srgb, var(--contact-note-base) 48%, #17212b);
    --profile-font-size: %%CV_FONT_SIZE_PROFILE%%;
    --experience-font-size: %%CV_FONT_SIZE_EXPERIENCE%%;
    --sidebar-font-size: %%CV_FONT_SIZE_SIDEBAR%%;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 9.6px; line-height: 1.25; }
  a { color: var(--link); text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; }
  .page { display: flex; flex-direction: column; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 5mm 6mm; }

  .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 5px; padding: 20px 12px 7px; border: 1px solid var(--hair2); border-radius: 8px; background: linear-gradient(180deg, #ffffff, #f6f8fa); font-size: var(--profile-font-size); }
  .hero::before { content: "\25CF \25CF \25CF   $ whoami"; position: absolute; left: 0; right: 0; top: 0; height: 12px; line-height: 12px; padding-left: 8px; background: var(--elem); border-bottom: 1px solid var(--hair2); color: #526272; font-family: var(--mono); font-size: .6742em; letter-spacing: .04em; }
  .kicker { display: inline-flex; width: fit-content; padding: 2px 7px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-family: var(--mono); font-size: 6.4px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
  h1 { margin: 3px 0 1px; font-family: var(--mono); font-size: 2.6966em; line-height: .95; letter-spacing: -.04em; text-transform: lowercase; color: var(--ink); }
  h1::after { content: "_"; color: var(--accent); }
  h1 a { color: inherit; }
  .title { margin: 0; color: var(--accent); font-size: 1.0562em; font-weight: 800; }
  .summary { margin: 4px 0 0; max-width: 158mm; color: var(--soft); font-size: 1em; }
  .avatar { width: 66px; height: 66px; border-radius: 6px; object-fit: cover; border: 1px solid var(--hair2); position: relative; z-index: 1; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px; }
  .metric { padding: 3px 7px; border: 1px solid var(--hair2); border-radius: 4px; background: #fff7f2; }
  .metric b { display: block; color: var(--accent); font-family: var(--mono); font-size: 1.4045em; letter-spacing: -.03em; }
  .metric span { display: block; color: var(--muted); font-size: .7416em; text-transform: uppercase; letter-spacing: .07em; }

   .layout { display: grid; grid-template-columns: 1fr 64mm; gap: 7px; align-items: start; }
   .layout.main-only, .layout.rail-only { grid-template-columns: 1fr; }
  .experience { font-size: var(--experience-font-size); }
  .experience h2 { margin: 0 0 4px; font-family: var(--mono); font-size: 1.4024em; letter-spacing: -.02em; }
  .rail h2 { margin: 0 0 4px; font-family: var(--mono); font-size: 1.5541em; letter-spacing: -.02em; }
  h2::before { content: "// "; color: var(--accent); }
  .job { margin-bottom: 4px; padding: 5px 8px; border: 1px solid var(--hair); border-radius: 6px; background: var(--panel); }
  .job-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .experience h3 { margin: 0; font-family: var(--mono); font-size: 1.2683em; }
  .experience .job-head span, .experience .role-head time, .experience .job-place { color: var(--muted); font-family: var(--mono); font-size: .878em; font-weight: 700; }
  .role { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--hair); }
  .role:first-of-type { border-top: 0; margin-top: 2px; padding-top: 2px; }
  .role-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .experience h4 { margin: 0; color: var(--cyan); font-size: 1.0732em; }
  .experience p { margin: 1.5px 0; color: var(--soft); font-size: var(--experience-font-size); }
  .experience ul { margin: 1.5px 0 0; padding-left: 12px; color: var(--soft); font-size: var(--experience-font-size); }
  li { margin: 1px 0; }
  li::marker { color: var(--accent); }

  .rail { display: grid; gap: 4px; font-size: var(--sidebar-font-size); }
   .compensation > p { margin: 1px 0; color: var(--soft); font-size: 1.1081em; }
   .compensation > .compensation-link { color: var(--link); }
   .rail-box { padding: 4px 8px; border: 1px solid var(--hair); border-radius: 6px; background: var(--panel); }
  .signal { display: grid; grid-template-columns: 16px 1fr; gap: 5px; padding: 3px 0; border-top: 1px solid var(--hair); }
  .signal:first-of-type { border-top: 0; }
   .signal-index { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, #f3b080, #d66b35); color: #241207; font-family: var(--mono); font-size: .8919em; font-weight: 900; }
  .signal b { display: block; font-size: 1.0811em; }
  .chips { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 1.5px; }
   .chips span { padding: .5px 4px; border: 1px solid var(--hair2); border-radius: 999px; background: var(--elem); color: var(--soft); font-family: var(--mono); font-size: .8108em; font-weight: 700; }
  .mini { padding: 3px 0; border-top: 1px solid var(--hair); }
  .mini:first-of-type { border-top: 0; }
  .mini b { display: block; font-size: 1.0676em; }
  .mini span { display: block; color: var(--muted); font-size: .9459em; }
  .mini p { margin: 1px 0 0; color: var(--soft); font-size: var(--sidebar-font-size); }
  .contact { display: grid; gap: 1.5px; }
  .contact a, .contact span { color: var(--soft); font-size: 1.027em; overflow-wrap: anywhere; }
  .contact a { color: var(--link); }
  .contact-note { margin-top: 3px; color: var(--contact-note-color); font-size: .9459em; }
  .foot { margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 6.6px; letter-spacing: .03em; }
  .page > .foot:last-child { margin-top: auto; }
  @page { size: A4; margin: 0; }
  @media print { .job, .role, .mini, .signal, .rail-box { break-inside: avoid; } }
</style>
</head>
<body>
<main class="page">
  %%CV_HEADER%%
  %%CV_HERO%%
  %%CV_LAYOUT%%
  %%CV_FOOTER%%
</main>
</body>
</html>
