/* ============================== helpers ============================== */

const $ = (s) => document.querySelector(s);
const scrollEl = $("#scroll"), input = $("#cmd"), suggestEl = $("#suggest");
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
/* Config prose supports a deliberately small, escaped-first Markdown subset. */
function safeHref(href) {
  const value = String(href).trim();
  if (!value || /[\x00-\x1f\s"'<>]/.test(value)) return null;
  const external = /^https?:\/\/[^/?#]+/i.test(value) || /^mailto:.+/i.test(value);
  const local = !/^[a-z][a-z0-9+.-]*:/i.test(value) && !value.startsWith("/") && !value.startsWith("\\");
  return external || local ? { href: value, external } : null;
}

function md(s) {
  const source = esc(s == null ? "" : s).replace(/\r\n?/g, "\n");
  const protectedHTML = [];
  const protect = (html) => `\x00${protectedHTML.push(html) - 1}\x00`;
  const inline = (text) => text
    .replace(/`([^`\n]+)`/g, (_, code) => protect(`<code>${code}</code>`))
    .replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, "<strong>$2</strong>")
    .replace(/(?<!\*)\*(?![\s*])(.+?)(?<!\s)\*(?!\*)/g, "<em>$1</em>")
    .replace(/(?<!\w)_(?![\s_])(.+?)(?<!\s)_(?!\w)/g, "<em>$1</em>");
  const linked = source.replace(/\[([^\]\n]+)\]\(([^()\s]*(?:\([^()\s]*\)[^()\s]*)*)\)/g, (_, label, href) => {
    const safe = safeHref(href);
    const renderedLabel = inline(label);
    return safe
      ? protect(`<a href="${safe.href}" target="_blank" rel="noopener noreferrer">${renderedLabel}</a>`)
      : renderedLabel;
  });
  let rendered = inline(linked).replace(/\n/g, "<br>");
  for (let i = 0; i < protectedHTML.length; i += 1) {
    rendered = rendered.replace(/\x00(\d+)\x00/g, (_, index) => protectedHTML[Number(index)]);
  }
  return rendered;
}
/* <k>…</k> in config strings → highlighted keyword span; everything else is escaped */
const kfmt = (s) => esc(s).replace(/&lt;k&gt;/g, '<span class="k">').replace(/&lt;\/k&gt;/g, "</span>");
const scrollBottom = () => { scrollEl.scrollTop = scrollEl.scrollHeight; };

function push(htmlStr, cls = "msg") {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = htmlStr;
  scrollEl.appendChild(div);
  scrollBottom();
  return div;
}

function panel(title, body, meta = "") {
  return `<div class="panel"><div class="panel-title">${esc(title)}${meta ? `<span>${esc(meta)}</span>` : ""}</div><div class="panel-body">${body}</div></div>`;
}

/* ============================== renderers ============================== */

function rHelp(cmd) {
  const visible = COMMANDS.filter(c => !c.hidden);
  const rows = visible
    .map(c => `<div class="hrow"><span class="hcmd">${c.type === "link" ? `<a href="${esc(c.href)}" target="_blank" rel="noopener noreferrer">${esc(c.name)} ↗</a>` : `<button type="button" data-run="${esc(c.name)}">${esc(commandUsage(c))}</button>`}</span><span class="hdesc">${esc(c.desc)}</span></div>`)
    .join("");
  return panel(cmd.panelTitle, `<div class="help-grid">${rows}</div>
    <p class="desc" style="margin-top:10px">${kfmt(CONFIG.messages.helpTip)}</p>`, cmd.panelMeta || `${visible.length} commands`);
}

function rExperience(cmd) {
  const body = CONFIG.experience.map(job => `
    <div class="item">
      <div class="row"><b>${esc(job.company)}</b><time>${esc(job.period)}</time></div>
      <div class="loc">${esc(job.location)}</div>
      ${job.roles.map(r => {
        const content = resolveRoleContent(r, "tui");
        return `
        <div class="roleline">└ ${esc(r.title)} <time>· ${esc(r.period)}</time></div>
        <p class="desc">${md(content.description)}</p>
        <ul class="points">${content.points.map(p => `<li>${md(p)}</li>`).join("")}</ul>

    </div>`).join("");
  return panel(cmd.panelTitle, body, cmd.panelMeta);

    <dt>github</dt><dd><a href="${esc(c.github)}" target="_blank" rel="noopener noreferrer">${esc(c.github.replace("https://", ""))}</a></dd>
    <dt>location</dt><dd>${esc(c.location)}</dd>

function rWhoami(cmd) {
  return panel(cmd.panelTitle, `<div class="row"><b>${esc(CONFIG.profile.name)}</b></div>
    <p class="desc">${md(CONFIG.profile.title)}</p>
    <p class="desc">${md(CONFIG.profile.summary)}</p>`, cmd.panelMeta);
}

/* Target-specific role prose inherits every omitted field from shared content. */
function resolveRoleContent(role, target) {
  const shared = role.content || {};
  const override = (shared.overrides && shared.overrides[target]) || {};
  return {
    description: override.description === undefined ? shared.description : override.description,
    points: override.points === undefined ? shared.points : override.points
  };
}

/* ============================== commands ============================== */

const RENDERERS = {
  help: rHelp, experience: rExperience, education: rEducation, skills: rSkills,
  portfolio: rPortfolio, compensation: rCompensation, certifications: rCerts,
  contact: rContact, whoami: rWhoami
};

const TUI_SECTIONS = new Set(CONFIG.outputs.tui.sections);
const COMMAND_SECTION_REQUIREMENTS = Object.freeze({
  experience: ["experience"], education: ["education"], skills: ["skills"],
    compensation: ["compensation"], certifications: ["certifications"],
  contact: ["contact"], whoami: ["profile"], portfolio: ["profile", "honours"]
});

function commandEnabled(command, sections = TUI_SECTIONS) {
  return (COMMAND_SECTION_REQUIREMENTS[command.type] || []).every(section => sections.has(section));
}

function enabledCommands(commands, sections = TUI_SECTIONS) {
  return commands.filter(command => commandEnabled(command, sections));
}

const COMMANDS = enabledCommands(CONFIG.commands)
  .map(c => ({ ...c, run: RENDERERS[c.type] || null }));

function findCommand(word) {
  const w = word.toLowerCase();
  return COMMANDS.find(c => c.name === w || (c.aliases || []).includes(w));
}

function commandUsage(command) {
  return command.type === "theme"
    ? String(command.usage || command.name).replace(/\s+\[light\|dark\]\s*$/i, "")
    : (command.usage || command.name);
}

function commandLink(token) {
  const value = String(token).trim();
  return findCommand(value)
    ? `<a href="#" data-run="${esc(value)}">${esc(value)}</a>`
    : esc(token);
}

function bootHint(hint) {
  return kfmt(hint).replace(/<span class="k">(\/[A-Za-z0-9_-]+)<\/span>/g,
    (match, token) => findCommand(token) ? commandLink(token) : match);
}

/* ============================== engine ============================== */

const history = [];
let historyIdx = -1;
const SPINNER = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];

function doClear() {
  scrollEl.innerHTML = "";
  push(`<span class="hint">${kfmt(CONFIG.messages.cleared)}</span>`);
}

async function exec(raw, opts = {}) {
  const line = raw.trim();
  if (!line) return;
  if (!opts.silent) {
    history.push(line);
    historyIdx = history.length;
  }
  push(`<div class="echo">${esc(line)}</div>`);

  const parts = (line.startsWith("/") ? line : "/" + line).split(/\s+/);
  const word = parts[0], args = parts.slice(1);
  const cmd = findCommand(word);

  if (cmd && cmd.type === "clear") { doClear(); return; }

  if (cmd && cmd.type === "theme") {
    const want = THEMES.includes((args[0] || "").toLowerCase())
      ? args[0].toLowerCase()
      : (currentTheme() === "dark" ? "light" : "dark");
    applyTheme(want);
    push(`<div class="ok">◐ ${esc(CONFIG.theme.switchedText.replace("{theme}", want))}</div>`);
    return;
  }

  if (cmd && cmd.type === "models") {
    openModelModal();
    return;
  }

  if (!cmd) {
    const hints = CONFIG.messages.errorHintCmds
      .filter(hint => findCommand(hint))
      .map(hint => `<a href="#" data-run="${esc(hint)}">${esc(hint)}</a>`)
      .join(" · ");
    push(`<div class="err"><b>error:</b> ${esc(CONFIG.messages.unknownCommand)} <b>${esc(word)}</b>${hints ? ` — try ${hints}` : ""}.</div>`);
    return;
  }

  if (cmd.type === "link") {
    push(`<div class="ok">↗ ${esc(CONFIG.messages.openingLink)} <a href="${esc(cmd.href)}" target="_blank" rel="noopener noreferrer">${esc(cmd.href)}</a> …</div>`);
    window.open(cmd.href, "_blank", "noopener");
    return;
  }

  if (!opts.instant) {
    const spin = push(`<span class="spin">⠋ running ${esc(cmd.name)}…</span>`);
    let i = 0;
    const t = setInterval(() => { spin.firstChild.textContent = `${SPINNER[i++ % SPINNER.length]} running ${cmd.name}…`; }, 60);
    await new Promise(r => setTimeout(r, 260 + Math.random() * 240));
    clearInterval(t);
    spin.remove();
  }
  push(cmd.run(cmd));
}

/* ============================== autocomplete ============================== */

let sugItems = [], sugIdx = 0;

function renderSuggest() {
  if (!sugItems.length) { suggestEl.classList.remove("open"); return; }
  suggestEl.innerHTML = sugItems.map((c, i) =>
    `<div class="sug${i === sugIdx ? " sel" : ""}" data-idx="${i}" role="option"><span class="sc">${esc(c.name)}</span><span class="sd">${esc(c.desc)}</span></div>`
  ).join("");
  suggestEl.classList.add("open");
}

function updateSuggest() {
  const v = input.value.trim().toLowerCase();
  if (!v.startsWith("/") || v.includes(" ")) { sugItems = []; renderSuggest(); return; }
  sugItems = COMMANDS.filter(c => !c.hidden && (c.name.startsWith(v) || (c.aliases || []).some(a => a.startsWith(v))));
  sugIdx = Math.min(sugIdx, Math.max(0, sugItems.length - 1));
  renderSuggest();
}

function acceptSuggestion() {
  if (!sugItems.length) return false;
  input.value = sugItems[sugIdx].name;
  sugItems = [];
  renderSuggest();
  return true;
}

/* ============================== events ============================== */

input.addEventListener("input", () => { sugIdx = 0; updateSuggest(); });

input.addEventListener("keydown", (e) => {
  if (modelOverlay.classList.contains("open")) return;
  const open = suggestEl.classList.contains("open");
  if (e.key === "Enter") {
    e.preventDefault();
    if (open && sugItems.length && input.value.trim() !== sugItems[sugIdx].name) { acceptSuggestion(); return; }
    const v = input.value;
    input.value = "";
    sugItems = []; renderSuggest();
    exec(v);
  } else if (e.key === "Tab") {
    e.preventDefault();
    acceptSuggestion();
  } else if (e.key === "ArrowUp") {
    if (open) { e.preventDefault(); sugIdx = (sugIdx - 1 + sugItems.length) % sugItems.length; renderSuggest(); }
    else if (history.length) { e.preventDefault(); historyIdx = Math.max(0, historyIdx - 1); input.value = history[historyIdx] || ""; }
  } else if (e.key === "ArrowDown") {
    if (open) { e.preventDefault(); sugIdx = (sugIdx + 1) % sugItems.length; renderSuggest(); }
    else if (history.length) {
      e.preventDefault();
      historyIdx = Math.min(history.length, historyIdx + 1);
      input.value = historyIdx >= history.length ? "" : history[historyIdx];
    }
  } else if (e.key === "Escape") {
    sugItems = []; renderSuggest();
  }
});

suggestEl.addEventListener("mousedown", (e) => {
  const el = e.target.closest(".sug");
  if (!el) return;
  e.preventDefault();
  sugIdx = +el.dataset.idx;
  acceptSuggestion();
  input.focus();
});

$("#term").addEventListener("click", (e) => {
  const runEl = e.target.closest("[data-run]");
  if (runEl) { e.preventDefault(); exec(runEl.dataset.run); }
  if (runEl) return;
  if (e.target.closest("a, button, .panel-body, .suggest")) return;
  if (window.getSelection().toString()) return;
  input.focus();
});

const THEMES = ["dark", "light"];

}

function updateThemeLabel() {

function applyTheme(t, persist = true) {
  if (!THEMES.includes(t)) t = CONFIG.theme.default;
  document.documentElement.dataset.theme = t;
  if (persist) { try { localStorage.setItem("od-theme", t); } catch (e) { /* private mode */ } }
  updateThemeLabel();
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("od-theme"); } catch (e) { /* private mode */ }

}

const MODELS = CONFIG.modal.models;
const modelOverlay = $("#modelOverlay"), modelList = $("#modelList");
let modelIdx = 0;

function renderModels() {
  modelList.innerHTML = MODELS.map((m, i) =>
    `<button class="model-row${m.active ? " active" : ""}${i === modelIdx ? " sel" : ""}" data-idx="${i}">
       <span class="mid">${esc(m.id)}</span><span class="mnote">${esc(m.note)}</span>
     </button>`).join("");
}

function openModelModal() {
  modelIdx = 0;
  renderModels();
  modelOverlay.classList.add("open");
}
function closeModelModal() {
  modelOverlay.classList.remove("open");
  input.focus();
}

function pickModel(i) {
  const m = MODELS[i];
  const active = MODELS.find(x => x.active) || m;
  const fmt = (s) => esc(s.replace("{model}", m.id).replace("{active}", active.id));
  closeModelModal();
  if (m.active) {
    push(`<div class="ok">✓ ${fmt(CONFIG.modal.acceptText)}</div>`);
  } else {
    const link = CONFIG.modal.rejectLinkCmd;
    const enabledLink = findCommand(link);
    push(`<div class="err"><b>error:</b> ${fmt(CONFIG.modal.rejectText)}${enabledLink ? ` <a href="#" data-run="${esc(link)}">${esc(link)}</a>` : ""}</div>`);
  }
}

window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "p") {
    e.preventDefault();
    modelOverlay.classList.contains("open") ? closeModelModal() : openModelModal();
    return;
  }
  if (!modelOverlay.classList.contains("open")) return;
  if (e.key === "Escape") { e.preventDefault(); closeModelModal(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); modelIdx = (modelIdx + 1) % MODELS.length; renderModels(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); modelIdx = (modelIdx - 1 + MODELS.length) % MODELS.length; renderModels(); }
  else if (e.key === "Enter") { e.preventDefault(); pickModel(modelIdx); }
});
modelList.addEventListener("click", (e) => {
  const row = e.target.closest(".model-row");
  if (row) pickModel(+row.dataset.idx);
});
modelOverlay.addEventListener("click", (e) => { if (e.target === modelOverlay) closeModelModal(); });

  check("default theme from config", document.documentElement.dataset.theme === CONFIG.theme.default);
  check("statusbar theme toggle exists", !!$("#themeToggle"));
  const bgBefore = getComputedStyle(document.body).backgroundColor;
  await exec("/theme", { instant: true, silent: true });
  const flipped = document.documentElement.dataset.theme;
  check("/theme toggles theme", flipped !== CONFIG.theme.default && THEMES.includes(flipped));
  check("theme switch message shown", lastHTML().includes(flipped));
  check("theme persisted to localStorage", (() => { try { return localStorage.getItem("od-theme") === flipped; } catch (e) { return true; } })());
  check("palette actually changes colors", getComputedStyle(document.body).backgroundColor !== bgBefore);
  await exec("/theme " + CONFIG.theme.default, { instant: true, silent: true });
  check("/theme <name> sets explicit theme", document.documentElement.dataset.theme === CONFIG.theme.default);
  $("#themeToggle").click();
  check("statusbar click toggles theme", document.documentElement.dataset.theme !== CONFIG.theme.default);
  check("toggle label updates", $("#themeToggle").textContent.includes(document.documentElement.dataset.theme));
  applyTheme(CONFIG.theme.default, false);
  try { localStorage.removeItem("od-theme"); } catch (e) {}

  /* layout: only console scrolls */
  const termCS = getComputedStyle(document.querySelector(".term"));
  check("term clips overflow (sidebar fixed)", termCS.overflow === "hidden" || termCS.overflowY === "hidden");
  check("console scroll area is scrollable", getComputedStyle(scrollEl).overflowY === "auto");
  check("base font >= 17.5px", parseFloat(getComputedStyle(document.body).fontSize) >= 17.5);

  const passed = results.filter(r => r[1]).length;
  const failed = results.filter(r => !r[1]).map(r => r[0]);
  document.title = (failed.length ? "TESTS FAIL " : "TESTS PASS ") + `${passed}/${results.length}` + (failed.length ? " | " + failed.join("; ") : "");
  push(panel("autotest results", `<p class="desc ${failed.length ? "err" : "ok"}">${passed}/${results.length} assertions passed${failed.length ? " — failed: " + esc(failed.join(", ")) : ""}</p>`), "msg");
}

if (location.hash === "#autotest") autotest();
</script>
</body>
</html>
